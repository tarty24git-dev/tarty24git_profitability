<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CTH TI Plus Profitability Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        .btn-primary {
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
        }
        .brand-title {
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h4 class="brand-title mb-1">CTH FINANCIAL ENGINE</h4>
        <h6 class="text-light mb-1">TI Plus Trade Finance Profitability</h6>
        <p class="text-secondary small mb-4">Enterprise Profitability Analysis Platform</p>

        <div id="errorAlert" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="loginForm" method="POST" action="/api/auth/login">
            <div class="mb-3 text-start">
                <label for="username" class="form-label text-secondary small">Username</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="username" name="username" value="admin" required>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label text-secondary small">Password</label>
                <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" value="Qwerty123$" required>
            </div>
            <div class="mb-3 text-start form-check d-none" id="2faGroup">
                <input type="checkbox" class="form-check-input" id="enable2fa">
                <label class="form-check-label text-secondary small" for="enable2fa">Request 2FA OTP Code</label>
            </div>
            <div class="mb-3 text-start text-secondary small">
                Default Pass: <span class="text-info">Qwerty123$</span>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            try {
                const response = await fetch('/api/auth/login-rest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (response.ok) {
                    sessionStorage.setItem('user', JSON.stringify(data));
                    window.location.href = '/index.html';
                } else {
                    errorAlert.textContent = data.message || 'Login failed. Please check your credentials.';
                    errorAlert.classList.remove('d-none');
                }
            } catch (err) {
                errorAlert.textContent = 'Server connection error.';
                errorAlert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
