apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-finance-profitability
  labels:
    app: trade-finance-profitability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trade-finance-profitability
  template:
    metadata:
      labels:
        app: trade-finance-profitability
    spec:
      containers:
      - name: trade-finance-engine
        image: cth/trade-finance-profitability:1.0.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
---
apiVersion: v1
kind: Service
metadata:
  name: trade-finance-service
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: trade-finance-profitability
