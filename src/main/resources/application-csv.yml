spring:
  datasource:
    url: jdbc:h2:mem:csvtradedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
app:
  csv:
    file-db-mode: true
    file-db-path: "data/db_store.csv"
