spring:
  application:
    name: CTH TI Plus Trade Finance Profitability Engine
  datasource:
    url: jdbc:h2:mem:tradedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Application Specific Configurations
app:
  name: "CTH TI Plus Profitability Platform"
  auth:
    ldap:
      enabled: false
      url: "ldap://active-directory.cth.com:389"
      base-dn: "dc=cth,dc=com"
    2fa:
      enabled: false
  csv:
    input-dir: "data/input"
    output-dir: "data/output"
    file-db-path: "data/db_store.csv"

server:
  port: 8080
